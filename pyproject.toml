[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rhp-pinn"
version = "1.0.0"
description = "RSA-Hybrid Physics-Informed Neural Network for Path Planning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.5",
    "scipy>=1.10",
]